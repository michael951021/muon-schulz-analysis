[project]
name = "nsshape"
version = "0.1.0"
description = "Newton-Schulz polynomial shaping ablation for Muon"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
solve = ["scipy>=1.11"]
torch = ["torch>=2.2"]
plot = ["matplotlib>=3.8"]
experiment = ["scipy>=1.11", "torch>=2.2", "datasets>=3.0", "tiktoken>=0.8", "huggingface-hub>=0.27", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "scipy>=1.11", "torch>=2.2", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nsshape"]

[tool.hatch.build.targets.wheel.force-include]
"data/coefficients/v1.json" = "nsshape/data/coefficients/v1.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: solver fits, minutes not seconds"]
